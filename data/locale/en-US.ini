Warp.Playlist.Transition="Transition Between Videos"
Warp.Playlist.TransitionDuration="Transition Duration"
Warp.Playlist.TransitionTiming="Transition Timing"
Warp.Playlist.TransitionTiming.Overlap="Overlap the end of the file"
Warp.Playlist.TransitionTiming.After="Start once the file has finished"
Warp.Playlist.TransitionTiming.Desc="Overlapping starts the transition early enough that it finishes at the moment the\ncurrent file runs out, so the file plays out in full underneath it.\nStarting after the file plays the file to its last frame first, and the transition\nruns on top of that frame."
Warp.Playlist.Transition.Properties="Transition Properties..."
Warp.Playlist.Transition.Properties.Desc="Opens the settings of the transition itself, the same ones OBS shows for the\ntransitions in its own list: direction, color, the stinger video file and so on,\nwhatever the transition that is picked has to offer.\nA stinger's transition point is read from there as well: the playlist moves on that\nfar before the current file ends, so the swap behind the stinger still lands on its\nlast frame."
Warp.Playlist.Transition.Scale="Scaling"
Warp.Playlist.Transition.Scale.Fit="Fit (keep aspect ratio)"
Warp.Playlist.Transition.Scale.Stretch="Stretch"
Warp.Playlist.Transition.Scale.DownOnly="Scale down only"
Warp.Playlist.Transition.Scale.Desc="How a file is fitted while it shares the screen with another one.\nOnly has an effect when the files in the playlist are not all the same size."
Warp.Playlist.Transition.Alignment="Alignment"
Warp.Playlist.SeparateBackTransition="Use a different transition when going back"
Warp.Playlist.SeparateBackTransition.Desc="Gives going back through the playlist a transition of its own, set up in the\nsection below: the transition above is then the one used to go forward, which is\nwhere automatic advance, Next Video and starting the playlist over all go.\nWith this off, the transition above handles both directions."
Warp.Playlist.Group.Transition.Forward="Transition (Going Forward)"
Warp.Playlist.Group.Transition.Back="Transition (Going Back)"
Warp.Playlist.Transition.Back="Transition Between Videos"
Warp.Playlist.Transition.Back.Properties.Desc="Opens the settings of the transition itself, the same ones OBS shows for the\ntransitions in its own list: direction, color, the stinger video file and so on,\nwhatever the transition that is picked has to offer.\nThis is the transition Previous Video runs, so it starts the moment you ask for\nit rather than being placed against the end of a file."

