Warp.Flow.Kind.Replay="Replay List"
Warp.Flow.Kind.Replay.Desc="A list that fills itself with the clips the OBS replay buffer saves.\n\nPick the Warp Playlist source it feeds, whether it saves the replay buffer itself from a hotkey of its own or takes the saves made anywhere else, and which end of the list a new clip goes on.\n\nNothing about playback is disturbed when a clip lands: the playlist keeps playing what it is playing, and reaches the new clip in its turn."
Warp.Flow.Kind.Highlight="Highlight List"
Warp.Flow.Kind.Highlight.Desc="A list that keeps the clips worth keeping.\n\nIt works the way a replay list does, and it can be fed by one: a replay flow hands every clip it takes to the flows it is linked to, so a highlight reel builds itself alongside the replay feed.\n\nIts own Add Last Saved Clip hotkey puts the replay that was just saved in it after the fact, for the ones worth keeping that nobody knew about in advance."
Warp.Flow.Kind.Combo="Combo List"
Warp.Flow.Kind.Combo.Desc="A replay list and a highlight list, made and linked in one go.\n\nThe replay list is the one that takes the saves, and every clip it takes goes to the highlight list as well. Each has its own playlist source and its own order, so the replay feed can run newest first while the highlights stay in the order they happened.\n\nThe highlight list is named after the replay one."

