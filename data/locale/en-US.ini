Warp.Zoom.Dock.NoTarget="Nothing to frame.\nAdd a Warp source, or put a Warp Zoom filter on a source."
Warp.Zoom.Dock.NoPicture="No picture yet."
Warp.Zoom.Dock.Reset="Reset"
