Warp.Playlist.TransitionTiming.After="Start once the file has finished"
Warp.Playlist.TransitionTiming.Desc="Overlapping starts the transition early enough that it finishes at the moment the\ncurrent file runs out, so the file plays out in full underneath it.\nStarting after the file plays the file to its last frame first, and the transition\nruns on top of that frame."
Warp.Playlist.Transition.Properties="Transition Properties..."
Warp.Playlist.Transition.Properties.Desc="Opens the settings of the transition itself, the same ones OBS shows for the\ntransitions in its own list: direction, color, the stinger video file and so on,\nwhatever the transition that is picked has to offer.\nA stinger's transition point is read from there as well: the playlist moves on that\nfar before the current file ends, so the swap behind the stinger still lands on its\nlast frame."
