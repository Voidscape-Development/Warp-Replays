Warp.Playlist.Transition.Scale.Fit="Fit (keep aspect ratio)"
Warp.Playlist.Transition.Scale.Stretch="Stretch"
Warp.Playlist.Transition.Scale.DownOnly="Scale down only"
Warp.Playlist.Transition.Scale.Desc="How a file is fitted while it shares the screen with another one.\nOnly has an effect when the files in the playlist are not all the same size."
