Warp.Playlist.Files="Playlist"
Warp.Playlist.Shuffle="Shuffle the playback order"
Warp.Playlist.AutoAdvance="Automatically play the next file"
Warp.Playlist.AutoAdvance.Desc="Starts the next file in the playlist as the current one ends, with the transition\nplaced by the Transition Timing setting below.\nWith this off, playback stops at the end of each file until you press Next."
Warp.Playlist.Loop="Loop the playlist when the last file ends"
