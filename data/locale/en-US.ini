Warp.Detect.Event="React To"
Warp.Detect.Event.Desc="Every speed and frame stepping hotkey has an event of its own, named after that hotkey.\nThe three events ending in ... react to a value you choose below instead, or to any value.\n\nSpeed set to a value is the speed being put at that value outright: a preset speed hotkey,\nReset Speed, or the Speed property. Reaching that same speed by stepping up or down is\nthe speed up / slow down event instead.\n\nSpeed increase and speed decrease react to the speed moving in that direction whichever\nway it was asked to, so a speed set above the current one counts as well as a speed up."
