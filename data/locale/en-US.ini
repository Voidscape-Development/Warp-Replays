Warp.Zoom.Group="Zoom"
Warp.Zoom.Zoom="Zoom"
Warp.Zoom.Zoom.Desc="How far into the picture the source is framed. 100% is the whole picture; the zoom\nnever goes below it, so the edge of the video stays at the edge of the frame.\nThe source keeps the size it always had: only what is inside it is magnified."
Warp.Zoom.CentreX="Centre X"
Warp.Zoom.CentreY="Centre Y"
Warp.Zoom.Glide="Preset Glide"
Warp.Zoom.Glide.Desc="How long a move to a preset takes. The move eases in and out, so it reads as a camera\nmove rather than a jump. A preset can be given a glide of its own instead, so a wide\nshot can ease in slowly while a tight one snaps across."
Warp.Zoom.Nudge="Nudge Glide"
Warp.Zoom.Nudge.Desc="How long the zoom and pan hotkeys take to land. Short enough that holding a key down\nruns the presses into one continuous move; set it to zero for changes that land at once."
Warp.Zoom.Confirm="Line framing up before it goes to air"
Warp.Zoom.Confirm.Desc="Nothing reframes the source on the spot: the dock, the hotkeys and the websocket line the shot\nup instead, and it only moves when it is taken. The dock shows the shot you are building and\ngives you Take and Cancel; there are hotkeys for both, so a shot lined up in the dock can be\ntaken from a control surface.\nA shot that is never taken is dropped when the video changes, and turning this off drops it too."
Warp.Zoom.Presets.Note="Presets are made and named in the Warp Zoom dock, and set up by number in the Warp window."
Warp.Zoom.Presets.Note.Desc="The dock frames the source by eye: drag the picture to pan, roll the wheel to zoom, and\nkeep what you find as a preset. Every preset is reachable from a hotkey of its own and\nfrom the numbered Recall Zoom Preset hotkeys, in the order they are listed."
Warp.Zoom.Preset.Default="Default"
Warp.Zoom.Preset.Unnamed="Preset"
Warp.Zoom.Preset.Glide="Glide"
Warp.Zoom.Preset.Glide.Default="Use the source's glide"
Warp.Zoom.Preset.Path="Path"
Warp.Zoom.Preset.Path.Direct="Direct"
Warp.Zoom.Preset.Path.Arc="Arc"
Warp.Zoom.Preset.Path.Desc="The route the picture takes on the way to this preset.\nDirect holds the shot in its place in the frame the whole way across, so the move travels evenly and lands\nwithout a swing.\nArc walks the shot across the picture at a flat rate instead. There is less room to move at a wide zoom than\nat a tight one, so the shot is thrown out to the side of the frame as the move starts and creeps back as the\nzoom catches up - the swing Warp had before there was a choice."
Warp.Zoom.Preset.Save.Title="Save This Framing"
Warp.Zoom.Preset.Save.Prompt="Preset name"
Warp.Zoom.Preset.Save.Failed="The framing could not be saved as a preset."

